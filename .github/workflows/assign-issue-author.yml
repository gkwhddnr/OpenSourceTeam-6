name: Set issue defaults

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  assign-author:
    if: github.event.issue.user.type == 'User' && github.event.issue.assignees[0] == null
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Assign the issue to its author
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GH_REPO/issues/$ISSUE_NUMBER/assignees" \
            -f "assignees[]=$ISSUE_AUTHOR" \
            --jq '.assignees[].login' | tee "$RUNNER_TEMP/assigned-users.txt"
          if ! grep -Fxq "$ISSUE_AUTHOR" "$RUNNER_TEMP/assigned-users.txt"; then
            echo "::error::The issue author could not be assigned. Check repository access."
            exit 1
          fi

  set-milestone:
    if: github.event.issue.milestone == null
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Set the default milestone
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DEFAULT_MILESTONE: 1
        shell: bash
        run: |
          set -euo pipefail
          current_milestone=$(gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER" --jq '.milestone.number // empty')
          if [ -n "$current_milestone" ]; then
            exit 0
          fi
          assigned_milestone=$(gh api --method PATCH "repos/$GH_REPO/issues/$ISSUE_NUMBER" \
            -F "milestone=$DEFAULT_MILESTONE" --jq '.milestone.number')
          if [ "$assigned_milestone" != "$DEFAULT_MILESTONE" ]; then
            echo "::error::The default milestone could not be assigned."
            exit 1
          fi
